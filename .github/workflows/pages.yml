# Déploiement web sur GitHub Pages : build wasm + page minimale (web/).
#
# Déclenché sur chaque push vers main (et manuellement). Le site publié est
# composé de trois fichiers : index.html (affichage plein écran), gl.js
# (runtime web miniquad 0.4.11, versionné dans web/) et le binaire wasm du
# jeu (assets et police embarqués via include_bytes! - aucun fichier externe).
#
# Prérequis une fois dans les réglages du dépôt :
#   Settings > Pages > Source: "GitHub Actions"

name: Deploy WASM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dépendances système requises par le build : la manette gilrs tire
      # libudev-sys (libudev-dev), macroquad GL/X11 (libgl1-mesa-dev libx11-dev
      # libxi-dev) et l'audio ALSA (libasound2-dev) - sans libudev-dev le
      # build-script de libudev-sys échoue : « Package libudev was not found
      # in the pkg-config search path » (CI a échoué ici sur main).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev \
            libx11-dev libxi-dev libgl1-mesa-dev

      - uses: actions/configure-pages@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # « wasm-release » a été sauvegardé par un run en échec (deps
          # système manquantes) : key bumpée en v2 pour invalider ce cache
          # corrompu et repartir d'un build propre et connu bon.
          key: wasm-release-v2

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Assemble the site (index.html + glue + wasm)
        run: |
          mkdir -p site
          cp web/index.html web/gl.js site/
          cp target/wasm32-unknown-unknown/release/rust-meteors-mining.wasm site/
          ls -lh site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4