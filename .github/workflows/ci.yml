name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Vérifs (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dépendances système du build natif : manette gilrs → libudev-sys (exige
      # libudev-dev), macroquad → GL/X11 (libgl1-mesa-dev libx11-dev libxi-dev),
      # audio (quad-snd/ALSA) → libasound2-dev. Sans elles le build-script de
      # libudev-sys échoue: « Package libudev was not found in the pkg-config
      # search path ».
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev \
            libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Clippy : zéro warning toléré (les signatures historiques portent des
      # #[allow] ciblés et commentés, voir src/game.rs / generate.rs / render.rs)
      - name: Clippy (zéro warning)
        run: cargo clippy --all-targets -- -D warnings
      # Tests unitaires (physique, collisions, minage, accostage, scénarios…)
      - name: Tests
        run: cargo test --all-targets
      # Validation syntaxique des pages HTML+JS autonomes (éditeurs + page web
      # du jeu) : le script Node extrait et compile chaque bloc <script> inline.
      # web/index.html embarque la glue audio Web Audio (mm_audio_*) du build
      # wasm : une erreur de syntaxe y rendrait le son muet sans échec de
      # compilation Rust, d'où sa présence ici.
      - name: Synthaxe JS des pages
        run: |
          set -e
          node .github/scripts/validate-editor-js.mjs \
            tools/marketplace-editor/index.html \
            tools/scenario-editor/index.html \
            web/index.html
      # Tests de non-régression de l'entraîneur : l'écart de récompense de la
      # politique apprise (policy.json) à l'autopilote du jeu reste dans la
      # tolérance, le micro-simulateur vaisseau reproduit **exactement** la
      # physique d'une vraie partie (fixture de fenêtres enregistrées) et la
      # politique **embarquée dans le jeu** (assets/ship_pilot_policy.json,
      # Phase 4) reste celle que le fixture fait rejouer au portage Rust. Les
      # autopilotes sont **portés en Python** (tools/trainer/autopilot_ref.py,
      # ship_autopilot_ref.py) et les micro-simulateurs remplacent le processus
      # de jeu : aucun Rust à compiler, aucune dépendance Python (stdlib
      # `unittest`). Les **deux moteurs d'entraînement** du réseau
      # (test_nn_backend.py) sont verrouillés : le chemin Python pur reste sans
      # dépendance et le chemin numpy - optionnel, celui qui entraîne l'artefact
      # embarqué - doit apprendre autant (ses cas se **sautent** si numpy est
      # absent, ce qui est le cas ici : la CI n'installe rien). Le **protocole de
      # mesure en boucle fermée dans le jeu**
      # (measure_in_game.py, Phase 4) est vérifié sans partie : sa logique de
      # mesure (dénouements, garde-fous, attente de la bascule de cerveau) est
      # testée contre un faux client, contre lequel le script reste rejouable.
      - name: Tests entraîneur (écart à l'autopilote + ports + simulateurs + politique embarquée)
        working-directory: tools/trainer
        run: python3 -m unittest -v test_reward_gap test_ship_port test_ship_env test_learned_pilot test_nn_backend test_measure_in_game
      # Build release complet (binaire autonome) : compile au moins une fois
      # avec le profil release (lto + strip)
      - name: Build release
        run: cargo build --release

  wasm:
    name: Compilation WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # La cible wasm ne peut pas compiler le module x11 (libc X11) ni le
      # serveur HTTP de télécommande : ils sont exclus par cfg, voir
      # `src/x11.rs` / `src/remote.rs`.
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown