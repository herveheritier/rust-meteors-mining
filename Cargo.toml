[package]
name = "rust-meteors-mining"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Portage en Rust de « Meteors Mining » (jeu QB64) - voir docs/PORTAGE.md"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }  # audio = quad-snd (Phase 4)
rand = "0.8"           # PRNG seedé pour la génération procédurale (Phase 3)
rand_chacha = "0.3"    # générateur ChaCha12 (déterministe, testable)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Active le décodage JPEG dans la crate `image` (unifiée avec celle de macroquad,
# qui ne compile que png/tga) : la texture météore est embarquée en JPEG - c'est
# l'asset d'origine (`reference/assets/meteor_surface_tile.jpg`, 457 Ko vs 3,1 Mo
# en PNG) - pour réduire la taille du binaire autonome.
image = { version = "0.24", default-features = false, features = ["jpeg"] }
# Serveur HTTP minimal (sans SSL) pour la télécommande : le téléphone pilote
# le vaisseau depuis une page web servie par le jeu (voir src/remote.rs).
tiny_http = { version = "0.12", default-features = false }

# getrandom 0.2 (via rand 0.8) : sur wasm32-unknown-unknown, le tirage
# aléatoire doit passer par `window.crypto` (feature `js`) - sans elle la
# compilation échoue (compile_error! de getrandom). Dépendance cible :
# n'affecte pas les builds natifs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
